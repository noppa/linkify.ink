name = "linkify-sandbox"
main = "sandbox-worker.js"
compatibility_date = "2026-07-08"

# Cloudflare route patterns only allow a wildcard at the start of the hostname
# (no mid-label wildcard like sandbox-*), so this matches all subdomains and the
# worker itself narrows to sandbox-<uuid> hosts.
[[routes]]
pattern = "*.linkify.ink/*"
zone_name = "linkify.ink"

# No custom module rules: sandbox-worker.js imports sandbox-loader.html and
# sandbox-sw.js.txt, both of which Wrangler's built-in Text rule (**/*.html,
# **/*.txt) imports as strings. The service-worker file is deliberately named
# .js.txt rather than .js so the default ESModule rule (**/*.js) doesn't claim it
# and bundle it as an object; see sandbox-worker.js.
