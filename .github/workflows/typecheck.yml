name: Typecheck

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # extension/vendor/ is gitignored, so it has to be assembled before the
      # extension's own files can be type-checked against the codec bundle.
      - run: npm run build:extension
      - run: npm run typecheck
