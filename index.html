<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>linkify.ink</title>
		<link rel="stylesheet" type="text/css" href="styles.css" />
	</head>
	<body>
		<header>
			<a class="logo" href="#"><h1>linkify.ink</h1></a>
			<p>Embed and send files to your friends with a link.</p>
		</header>
		<main id="app-main"></main>

		<template id="file-browser-page-template">
			<section>
				<h2>Files</h2>

				<ul id="file-list"></ul>
			</section>

			<section>
				<h2>Share</h2>

				<div class="row">
					<a id="link">Link to your content</a>
					<button type="button" id="copy-link">Copy</button>
				</div>
			</section>
		</template>

		<template id="file-receiver-page-template"> </template>

		<template id="file-list-new-file-template">
			<li class="row">
				<button type="button">Add file</button>
			</li>
			<li class="row">
				<button type="button">Add folder</button>
			</li>
		</template>

		<script type="module" src="index.mjs"></script>
	</body>
</html>
